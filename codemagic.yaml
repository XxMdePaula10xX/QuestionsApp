# Codemagic CI/CD — Sabido
# Sprint 0: pipeline Android validado. iOS entra em sprint posterior e exige
# pré-requisitos com lead time (revisão): conta Apple Developer (US$99/ano),
# certificados/provisioning, APNs key e Mac para code signing — abrir cedo.

workflows:
  android-debug:
    name: Android (debug)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      vars:
        # Defina no Codemagic (App > Environment variables) ou via secrets:
        #   VITE_FIREBASE_API_KEY, VITE_FIREBASE_PROJECT_ID, etc.
        PACKAGE_NAME: 'com.sabido.app'
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Build web (Vite)
        script: npm run build
      - name: Adicionar plataforma Android (se ausente) e sincronizar
        script: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Gerar APK debug
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release:
    name: Android (release assinado)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      groups:
        - firebase   # VITE_FIREBASE_* configurados no Codemagic
        - keystore   # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      vars:
        PACKAGE_NAME: 'com.sabido.app'
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Build web (Vite)
        script: npm run build
      - name: Sincronizar Android
        script: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Decodificar keystore
        script: echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/keystore.jks"
      - name: Gerar AAB assinado
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_BUILD_DIR/keystore.jks" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/**/*.aab
    # publishing:
    #   google_play:        # habilitar quando a conta Play estiver pronta
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal    # teste fechado: 12 testers / 14 dias

  ios-release:
    name: iOS (TestFlight / App Store)
    # Runner macOS (você está no Windows; o build iOS roda na nuvem do Codemagic).
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # Configure em Codemagic > Teams > Integrations > App Store Connect (API key).
      app_store_connect: SabidoASC
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - firebase   # VITE_FIREBASE_* configurados no Codemagic
      vars:
        BUNDLE_ID: 'com.sabido.app'
        APP_STORE_APP_ID: '0000000000'   # ID numérico do app no App Store Connect
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sabido.app
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Build web (Vite)
        script: npm run build
      - name: Adicionar plataforma iOS (se ausente) e sincronizar
        script: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      - name: Injetar Privacy Manifest
        script: cp resources/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
      - name: Gerar ícones/splash nativos
        script: npx @capacitor/assets generate --ios --iconBackgroundColor '#1f66f0' --splashBackgroundColor '#1f66f0' || true
      - name: Aplicar perfis de assinatura
        script: xcode-project use-profiles
      - name: Build IPA assinado
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # ligue quando for promover de TestFlight p/ produção

