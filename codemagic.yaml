# Codemagic CI/CD — Sabido
# Sprint 0: pipeline Android validado. iOS entra em sprint posterior e exige
# pré-requisitos com lead time (revisão): conta Apple Developer (US$99/ano),
# certificados/provisioning, APNs key e Mac para code signing — abrir cedo.

workflows:
  android-debug:
    name: Android (debug)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      vars:
        # Defina no Codemagic (App > Environment variables) ou via secrets:
        #   VITE_FIREBASE_API_KEY, VITE_FIREBASE_PROJECT_ID, etc.
        PACKAGE_NAME: 'com.sabido.app'
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Build web (Vite)
        script: npm run build
      - name: Adicionar plataforma Android (se ausente) e sincronizar
        script: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Gerar APK debug
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release:
    name: Android (release assinado)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      groups:
        - firebase   # VITE_FIREBASE_* configurados no Codemagic
        - keystore   # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      vars:
        PACKAGE_NAME: 'com.sabido.app'
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Build web (Vite)
        script: npm run build
      - name: Sincronizar Android
        script: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Decodificar keystore
        script: echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/keystore.jks"
      - name: Gerar AAB assinado
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_BUILD_DIR/keystore.jks" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/**/*.aab
    # publishing:
    #   google_play:        # habilitar quando a conta Play estiver pronta
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal    # teste fechado: 12 testers / 14 dias

  ios-release:
    name: iOS (TestFlight / App Store)
    # Runner macOS (você está no Windows; o build iOS roda na nuvem do Codemagic).
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # Reutiliza a integração App Store Connect existente (mesma API key serve
      # para todos os apps do mesmo time Apple).
      app_store_connect: quantum_asc
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - firebase      # VITE_FIREBASE_* configurados no Codemagic
        - ios_signing   # CERTIFICATE_PRIVATE_KEY (a MESMA chave dos seus outros apps)
      vars:
        BUNDLE_ID: 'com.sabido.app'
        APP_STORE_APP_ID: '6786125665'   # ID numérico do app no App Store Connect
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Build web (Vite)
        script: npm run build
      - name: Adicionar plataforma iOS (se ausente) e sincronizar
        script: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      - name: Injetar Privacy Manifest (copia + adiciona ao target do Xcode)
        script: |
          cp resources/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          gem install xcodeproj --no-document 2>/dev/null || sudo gem install xcodeproj --no-document
          ruby resources/add_privacy_manifest.rb
      - name: Gerar ícones/splash nativos
        script: npx @capacitor/assets generate --ios --iconBackgroundColor '#1f66f0' --splashBackgroundColor '#1f66f0' || true
      - name: Preparar assinatura iOS (cert + profile + força signing no target)
        script: |
          set -e
          keychain initialize
          # Busca/cria o certificado de distribuição a partir da sua chave privada
          # (a mesma dos outros apps) e CRIA o provisioning profile de com.sabido.app.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          # Gera o export_options.plist (usado no passo de export do IPA).
          xcode-project use-profiles || true
          # Força a assinatura manual no target App (o passo acima nem sempre grava
          # as build settings no template do Capacitor -> corrige o erro de archive).
          gem install xcodeproj --no-document 2>/dev/null || sudo gem install xcodeproj --no-document
          ruby resources/set_ios_signing.rb
      - name: Número de build (maior que o último no App Store Connect)
        script: |
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          NEXT=$(( ${LATEST:-0} + 1 ))
          # piso de segurança: contador de builds do Codemagic (caso a consulta falhe)
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ]; then NEXT=$BUILD_NUMBER; fi
          echo "App Store Connect: último=${LATEST:-0} | BUILD_NUMBER=${BUILD_NUMBER:-0} -> CFBundleVersion=$NEXT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" ios/App/App/Info.plist
      - name: Build IPA assinado
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # ligue quando for promover de TestFlight p/ produção

